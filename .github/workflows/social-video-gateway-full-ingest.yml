name: social-video-gateway-full-ingest

on:
  push:
    branches:
      - 'agent/social-video-gateway-phase1'
    paths:
      - '.github/workflows/social-video-gateway-full-ingest.yml'

jobs:
  fb-full-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade yt-dlp 'skill-seekers[video-full]'
      - name: Download public Facebook Reel
        shell: bash
        run: |
          mkdir -p work evidence
          python -m yt_dlp --no-playlist -f 'bv*+ba/b' --merge-output-format mp4 \
            -o 'work/source.%(ext)s' \
            'https://www.facebook.com/share/r/19b56K4KxL/' \
            > evidence/download.log 2>&1
          test -s work/source.mp4
          printf '%s\n' 'FB_MEDIA_DOWNLOAD_PASS' > evidence/download_status.txt
          python - <<'PY'
          from pathlib import Path
          import json
          Path('work/source_manifest.json').write_text(json.dumps({
              'source_url': 'https://www.facebook.com/share/r/19b56K4KxL/',
              'platform': 'facebook',
              'purpose': 'learning_only',
              'acquisition_engine': 'yt-dlp',
              'provenance_preserved': True
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Convert local video with Skill Seekers
        shell: bash
        run: |
          mkdir -p skill_output
          set +e
          skill-seekers create work/source.mp4 --name fb-reel-learning \
            --output skill_output/fb-reel-learning --whisper-model tiny \
            > evidence/skill_seekers.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ] && test -f skill_output/fb-reel-learning/SKILL.md; then
            echo SKILL_SEEKERS_INGEST_PASS > evidence/skill_seekers_status.txt
          else
            echo SKILL_SEEKERS_INGEST_BLOCKED > evidence/skill_seekers_status.txt
          fi
          exit 0
      - name: Record evidence summary
        shell: bash
        run: |
          {
            cat evidence/download_status.txt
            cat evidence/skill_seekers_status.txt
            echo SOURCE_MANIFEST_PRESENT=$(test -f work/source_manifest.json && echo yes || echo no)
            echo SKILL_MD_PRESENT=$(test -f skill_output/fb-reel-learning/SKILL.md && echo yes || echo no)
          } | tee evidence/summary.txt
      - name: Upload text evidence and generated knowledge asset
        uses: actions/upload-artifact@v4
        with:
          name: social-video-fb-full-ingest
          path: |
            evidence/
            work/source_manifest.json
            skill_output/fb-reel-learning/
          if-no-files-found: warn
