<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大用一家人通話窗口</title><style>body{font-family:system-ui;background:#111;color:#eee;max-width:900px;margin:20px auto;padding:16px}.card{background:#1c1c1c;border:1px solid #333;border-radius:16px;padding:16px;margin:12px 0}button,input,select{font-size:17px;padding:13px;border-radius:10px;border:1px solid #555;background:#222;color:#fff;margin:4px}.primary{background:#1769d2}.seat{display:inline-block;padding:9px 13px;border:1px solid #555;border-radius:10px;margin:4px}.on{border-color:#58d68d}.pending{border-color:#ffd166;color:#ffd166}.speaking{border-color:#ffd166;background:#332b12}.ok{color:#7dff9c}.bad{color:#ff8888}.muted{color:#aaa;font-size:14px}#log,#shared{white-space:pre-wrap;background:#090909;padding:12px;border-radius:10px;min-height:170px;max-height:320px;overflow:auto}.listening{background:#8b1e1e!important}.toggleOn{background:#1769d2}</style></head><body><h1>大用一家人通話窗口</h1><div class="card"><span class="seat on" id="chairman">001 何董事長 · 真人</span><span class="seat pending" id="ceo">002 陳啟航 · GPT</span><span class="seat" id="d1">D1 小晴 · 女聲</span><span class="seat" id="d2">D2 阿凱 · 男聲</span><div class="muted">所有人共用 DAYONG-FAMILY-ROOM。語音與文字會同步進中央 Communication Bus；不是各講各的。</div></div><div class="card"><select id="mode"><option value="browser" selected>⚡ 本機 TTS 極速模式</option><option value="realtime">Inworld Realtime</option><option value="standard">Inworld Standard</option></select><br><button class="primary" id="mic">🎙 開始家庭會議</button><button class="toggleOn" id="continuous">🔁 連續聊天：開</button><button id="stop">停止</button><br><input id="txt" style="width:72%" placeholder="例如：小晴查一號機；阿凱驗證；啟航統整；大家一起討論"><button id="send">送出</button><div class="muted">同一房間內的訊息會被保存。002 若未接上 GPT Runtime，座位會明確顯示待接，不會假裝已連線。</div></div><div class="card">即時狀態：<span id="status">檢查中</span><div id="log"></div></div><div class="card"><b>一家人共享訊息</b><div class="muted">中央 Room Transcript，約每 1.5 秒刷新。</div><div id="shared">載入中…</div></div><script>const $=x=>document.getElementById(x),log=x=>{$('log').textContent+=x+'\n';$('log').scrollTop=$('log').scrollHeight};let session=crypto.randomUUID(),currentAudio=null,busy=false,listening=false,recognition=null,continuous=true,stopped=false,turnStart=0,firstAudioLogged=false,lastShared='';function setMic(){const b=$('mic');b.className=listening?'primary listening':'primary';b.textContent=listening?'🎙 聆聽中…':(busy?'🎙 插話':'🎙 開始家庭會議');$('continuous').className=continuous?'toggleOn':'';$('continuous').textContent='🔁 連續聊天：'+(continuous?'開':'關')}function pickVoice(agent){const vs=speechSynthesis.getVoices(),zhTW=vs.filter(v=>/^zh-TW/i.test(v.lang)),zh=vs.filter(v=>/^zh/i.test(v.lang)),pool=zhTW.length?zhTW:zh;if(agent==='D1')return pool.find(v=>/Hsiao|Yating|Mei|Ting|Female|女|Xiaoxiao/i.test(v.name))||pool[0]||null;return pool.find(v=>/YunJhe|Yunjian|Zhiwei|Male|男|Yunxi/i.test(v.name))||pool[1]||pool[0]||null}function markFirstAudio(){if(!firstAudioLogged&&turnStart){firstAudioLogged=true;const ms=Math.round(performance.now()-turnStart);log('[速度] 首聲 '+ms+' ms');$('status').textContent='已開口 · '+ms+' ms'}}function browserSpeak(t,a){return new Promise(r=>{if(!t)return r();const el=$(a.toLowerCase());if(el)el.className='seat on speaking';const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.voice=pickVoice(a);u.rate=a==='D1'?1.08:1.02;u.pitch=a==='D1'?1.06:.94;u.volume=1;u.onstart=markFirstAudio;u.onend=u.onerror=()=>{if(el)el.className='seat on';r()};speechSynthesis.speak(u)})}function b64blob(b64,type='audio/wav'){const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new Blob([bytes],{type})}async function playCloud(result,agent){if(!result?.audioContent)throw Error('Inworld 沒有回傳音訊');const el=$(agent.toLowerCase());if(el)el.className='seat on speaking';const url=URL.createObjectURL(b64blob(result.audioContent,result.contentType||'audio/wav'));currentAudio=new Audio(url);await new Promise((resolve,reject)=>{currentAudio.onplaying=markFirstAudio;currentAudio.onended=resolve;currentAudio.onerror=()=>reject(Error('手機播放失敗'));currentAudio.play().catch(reject)}).finally(()=>{URL.revokeObjectURL(url);if(el)el.className='seat on';currentAudio=null})}function wantsCEO(text){return /陳啟航|陈启航|啟航|启航|\b002\b|大哥|執行長|执行长|CEO/i.test(text)}function routeAgents(text){const d1=/小晴|小琴|\bD1\b|第一位/i.test(text),d2=/阿凱|阿凯|\bD2\b|第二位/i.test(text),both=/你們|你们|兩個|两个|大家|各自|一起|二位|兩位|一家人/.test(text)||(d1&&d2);if(both)return['D1','D2'];if(d2)return['D2'];if(d1)return['D1'];return['D1']}async function callInworld(text,agent,mode){const r=await fetch('/api/inworld',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,agent,mode,session_id:session,room_id:'DAYONG-FAMILY-ROOM'})});const j=await r.json();if(!r.ok)throw Error(j.detail||j.error||r.status);return j.result}function formatShared(m){const n=m.sender_name||m.sender_id;const to=m.recipient_id?' → '+m.recipient_id:'';return '['+n+to+'] '+m.content}async function refreshShared(){try{const r=await fetch('/api/family/messages?limit=60',{cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)return;const text=(j.messages||[]).map(formatShared).join('\n');if(text!==lastShared){lastShared=text;$('shared').textContent=text||'尚無訊息';$('shared').scrollTop=$('shared').scrollHeight}}catch{}}async function health(){try{const j=await(await fetch('/api/health',{cache:'no-store'})).json();for(const a of['D1','D2'])$(a.toLowerCase()).className='seat '+(j.agents?.[a]?'on':'pending');$('ceo').className='seat '+(j.agents?.['CEO-002']?'on':'pending');$('status').textContent=j.family_bus?(j.agents?.['CEO-002']?'一家人語音室已全員接通':'家庭 Room/Bus 已接通 · 002 Runtime 待接'):'Communication Bus 未接通';$('status').className=j.family_bus?'ok':'bad';log('系統：大用一家人通話窗口啟動。Room='+String(j.room_id||'DAYONG-FAMILY-ROOM'));log('系統：Communication Bus='+(j.family_bus?'ONLINE':'OFFLINE')+'；D1='+(j.agents?.D1?'ONLINE':'PENDING')+'；D2='+(j.agents?.D2?'ONLINE':'PENDING')+'；002='+(j.agents?.['CEO-002']?'ONLINE':'PENDING_BRIDGE'));}catch(e){$('status').textContent='語音管線檢查失敗';$('status').className='bad';log('[HEALTH] '+e.message)}}async function standardFlow(text){const r=await fetch('/api/conference',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,session_id:session,room_id:'DAYONG-FAMILY-ROOM'})});const j=await r.json();if(!r.ok)throw Error(j.detail||j.error||r.status);for(const t of j.turns||[]){if(!t.reply)continue;log('['+(t.agent_name||t.agent)+'] '+t.reply);const v=await callInworld(t.reply,t.agent,'standard');await playCloud(v,t.agent)}}async function realtimeFlow(text){await fetch('/api/family/message',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,sender_id:'CHAIRMAN-001',sender_name:'何董事長',session_id:session})});for(const agent of routeAgents(text)){if(stopped)return;$('status').textContent=(agent==='D1'?'小晴':'阿凱')+' 回應中…';const v=await callInworld(text,agent,'realtime');const name=agent==='D1'?'D1 小晴':'D2 阿凱';if(v.transcript){log('['+name+'] '+v.transcript);await fetch('/api/family/message',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:v.transcript,sender_id:agent==='D1'?'D1-003':'D2-004',sender_name:agent==='D1'?'小晴':'阿凱',session_id:session})})}await playCloud(v,agent)}if(wantsCEO(text)&&!$('ceo').className.includes(' on'))log('[002 陳啟航] 已收到家庭 Room 訊息；本頁 GPT Runtime Bridge 尚待接通。')}async function browserFlow(text){const r=await fetch('/api/conference',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,session_id:session,room_id:'DAYONG-FAMILY-ROOM'})});const j=await r.json();if(!r.ok)throw Error(j.detail||j.error||r.status);for(const t of j.turns||[]){if(stopped)return;if(t.reply){log('['+(t.agent_name||t.agent)+'] '+t.reply);await browserSpeak(t.reply,t.agent)}}if(wantsCEO(text)&&!$('ceo').className.includes(' on'))log('[002 陳啟航] 訊息已寫入共享 Room；GPT Runtime Bridge 尚待接通。')}async function go(text){if(!text||busy)return;busy=true;listening=false;stopped=false;turnStart=performance.now();firstAudioLogged=false;setMic();log('\n[001 何董事長] '+text);$('status').textContent='家庭會議接話中…';$('status').className='';try{const mode=$('mode').value;if(mode==='standard')await standardFlow(text);else if(mode==='realtime')await realtimeFlow(text);else await browserFlow(text);await refreshShared();if(!stopped){$('status').textContent=continuous?'換你說…':'完成';$('status').className='ok'}}catch(e){$('status').textContent='後端錯誤';$('status').className='bad';log('[ERROR] '+e.message)}finally{busy=false;setMic();if(continuous&&!stopped)setTimeout(startListening,120)}}function interrupt(){stopped=true;try{recognition?.abort()}catch{};speechSynthesis.cancel();if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;currentAudio=null}busy=false;listening=false;setMic()}$('send').onclick=()=>go($('txt').value.trim());$('txt').addEventListener('keydown',e=>{if(e.key==='Enter')go($('txt').value.trim())});$('continuous').onclick=()=>{continuous=!continuous;setMic()};$('stop').onclick=()=>{continuous=false;interrupt();$('status').textContent='已停止';setMic()};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let micWatchdog=null;function armMicWatchdog(){clearTimeout(micWatchdog);micWatchdog=setTimeout(()=>{if(continuous&&!busy&&!stopped&&!listening)startListening()},900)}function startListening(){if(!SR||listening||stopped)return;if(busy)interrupt();stopped=false;if(recognition){try{recognition.abort()}catch{}}recognition=new SR();recognition.lang='zh-TW';recognition.interimResults=false;recognition.continuous=false;recognition.maxAlternatives=1;recognition.onstart=()=>{listening=true;setMic();$('status').textContent='正在聽你說話…'};recognition.onresult=e=>{const text=e.results?.[0]?.[0]?.transcript?.trim()||'';if(text){$('txt').value=text;listening=false;setMic();go(text)}};recognition.onerror=e=>{listening=false;if(e.error!=='aborted'&&e.error!=='no-speech')log('[MIC] '+e.error);armMicWatchdog()};recognition.onend=()=>{listening=false;setMic();if(!busy&&continuous&&!stopped)armMicWatchdog()};try{recognition.start()}catch(e){listening=false;log('[MIC] '+e.message);armMicWatchdog()}}$('mic').onclick=()=>{if(busy)interrupt();stopped=false;startListening()};if(!SR)$('mic').onclick=()=>alert('請用 Chrome 開啟以使用語音辨識');speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();health();refreshShared();setInterval(refreshShared,1500);setMic();</script></body></html>
