<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大用一家人通話窗口</title><style>body{font-family:system-ui;background:#111;color:#eee;max-width:920px;margin:20px auto;padding:16px}.card{background:#1c1c1c;border:1px solid #333;border-radius:16px;padding:16px;margin:12px 0}button,input,select{font-size:17px;padding:13px;border-radius:10px;border:1px solid #555;background:#222;color:#fff;margin:4px}.primary{background:#1769d2}.meeting{background:#6d3cc3}.seat{display:inline-block;padding:9px 13px;border:1px solid #555;border-radius:10px;margin:4px}.on{border-color:#58d68d}.speaking{border-color:#ffd166;background:#332b12}.ok{color:#7dff9c}.bad{color:#ff8888}.muted{color:#aaa;font-size:14px}#log,#shared{white-space:pre-wrap;background:#090909;padding:12px;border-radius:10px;min-height:180px;max-height:360px;overflow:auto}.listening{background:#8b1e1e!important}</style></head><body><h1>大用一家人通話窗口</h1><div class="card"><span class="seat on">001 何董事長 · 真人</span><span class="seat" id="ceo">002 陳啟航 · 大哥</span><span class="seat" id="d1">D1 小晴 · 二姐</span><span class="seat" id="d2">D2 阿凱 · 三弟</span><div class="muted">一家人共用 DAYONG-FAMILY-ROOM。大哥主持、二姐與三弟主動接話，討論不是輪流念答案。</div></div><div class="card"><select id="mode"><option value="browser" selected>⚡ 固定本機 TTS</option><option value="realtime">Inworld Realtime</option><option value="standard">Inworld Standard</option></select><select id="voiceStyle"><option value="internal" selected>內部會議自然語氣</option><option value="external">對外會議專業語氣</option><option value="pitch">創業比賽答辯語氣</option></select><br><button class="meeting" id="meeting">👨‍👩‍👧‍👦 一家人開會模式</button><button class="primary" id="mic">🎙 開始說話</button><button id="stop">停止</button><br><input id="txt" style="width:72%" value="大哥，今天工作匯報，大家一起討論一下" placeholder="例如：大哥，今天工作匯報，大家一起討論一下"><button id="send">一般送出</button><div class="muted">聲音固定不換人，只切換語氣與節奏。對外模式會更穩定、自信、少播報腔。</div></div><div class="card">即時狀態：<span id="status">檢查中</span><div id="log"></div></div><div class="card"><b>一家人共享訊息</b><div class="muted">中央 Room Transcript，約每 1.5 秒刷新。</div><div id="shared">載入中…</div></div><script>const $=x=>document.getElementById(x),log=x=>{$('log').textContent+=x+'\n';$('log').scrollTop=$('log').scrollHeight};let session=crypto.randomUUID(),busy=false,stopped=false,currentAudio=null,lastShared='';const PROFILE={"CEO-002":{label:'002 陳啟航',gender:'male',store:'voice_ceo',base:{rate:.98,pitch:.88}},D1:{label:'D1 小晴',gender:'female',store:'voice_d1',base:{rate:1.06,pitch:1.05}},D2:{label:'D2 阿凱',gender:'male',store:'voice_d2',base:{rate:1.01,pitch:.95}}};const STYLE={internal:{rate:1.00,pitch:1.00,gap:80},external:{rate:.97,pitch:.99,gap:110},pitch:{rate:1.00,pitch:1.01,gap:95}};function allVoices(){return speechSynthesis.getVoices().filter(v=>/^zh/i.test(v.lang))}function scoreVoice(v,p){const n=v.name.toLowerCase();let s=0;if(/^zh-TW/i.test(v.lang))s+=10;if(/^zh-CN/i.test(v.lang))s+=3;if(p.gender==='female'&&/female|女|hsiao|yating|mei|ting|xiaoxiao|huihui|hanhan|xiaoyi/i.test(n))s+=14;if(p.gender==='male'&&/male|男|yunjhe|yunjian|zhiwei|yunxi|yunyang|yunfeng|yunhao/i.test(n))s+=14;if(/natural|neural|premium|enhanced/i.test(n))s+=5;return s}function lockVoice(agent){const p=PROFILE[agent],vs=allVoices(),saved=localStorage.getItem(p.store);if(saved){const hit=vs.find(v=>v.name===saved);if(hit)return hit}const ranked=[...vs].sort((a,b)=>scoreVoice(b,p)-scoreVoice(a,p));let pick=ranked[0]||null;if(agent==='D2'){const ceo=localStorage.getItem(PROFILE['CEO-002'].store);const alt=ranked.find(v=>v.name!==ceo);if(alt)pick=alt}if(pick)localStorage.setItem(p.store,pick.name);return pick}function normalizeSpeechText(t){return String(t||'').replace(/\s+/g,' ').replace(/([。！？!?；;])/g,'$1|').replace(/([，,])/g,'$1|').split('|').map(x=>x.trim()).filter(Boolean)}function prosody(agent,i,total){const p=PROFILE[agent],s=STYLE[$('voiceStyle')?.value||'internal'];let rate=p.base.rate*s.rate,pitch=p.base.pitch*s.pitch;if(total>1){const wave=[0,.015,-.01,.008,-.006][i%5];rate+=wave;if(agent==='D1')pitch+=[0,.015,-.008,.01][i%4];if(agent==='D2')pitch+=[0,-.008,.006,-.004][i%4];if(agent==='CEO-002')pitch+=[0,-.006,.004][i%3]}return{rate:Math.max(.85,Math.min(1.15,rate)),pitch:Math.max(.75,Math.min(1.2,pitch)),gap:s.gap}}function speakChunk(text,agent,i,total){return new Promise(r=>{if(!text||stopped)return r();const p=PROFILE[agent]||PROFILE.D1,u=new SpeechSynthesisUtterance(text),pr=prosody(agent,i,total);u.lang='zh-TW';u.voice=lockVoice(agent);u.rate=pr.rate;u.pitch=pr.pitch;u.volume=1;u.onend=u.onerror=()=>setTimeout(r,pr.gap);speechSynthesis.speak(u)})}async function speakLocal(text,agent){if(!text||stopped)return;const el=agent==='CEO-002'?$('ceo'):$(agent.toLowerCase());if(el)el.className='seat on speaking';const chunks=normalizeSpeechText(text);for(let i=0;i<chunks.length;i++){if(stopped)break;await speakChunk(chunks[i],agent,i,chunks.length)}if(el)el.className='seat on'}function b64blob(b64,type='audio/wav'){const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new Blob([bytes],{type})}async function playCloud(result,agent){if(!result?.audioContent)throw Error('Inworld 沒有回傳音訊');const el=$(agent.toLowerCase()),url=URL.createObjectURL(b64blob(result.audioContent,result.contentType||'audio/wav'));if(el)el.className='seat on speaking';currentAudio=new Audio(url);await new Promise((res,rej)=>{currentAudio.onended=res;currentAudio.onerror=rej;currentAudio.play().catch(rej)}).finally(()=>{URL.revokeObjectURL(url);if(el)el.className='seat on';currentAudio=null})}async function callInworld(text,agent,mode){const a=agent==='CEO-002'?'D2':agent;const r=await fetch('/api/inworld',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,agent:a,mode,session_id:session})});const j=await r.json();if(!r.ok)throw Error(j.detail||j.error||r.status);return j.result}function formatShared(m){return '['+(m.sender_name||m.sender_id)+(m.recipient_id?' → '+m.recipient_id:'')+'] '+m.content}async function refreshShared(){try{const r=await fetch('/api/family/messages?limit=80',{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)return;const t=(j.messages||[]).map(formatShared).join('\n');if(t!==lastShared){lastShared=t;$('shared').textContent=t||'尚無訊息';$('shared').scrollTop=$('shared').scrollHeight}}catch{}}async function health(){try{const j=await(await fetch('/api/health',{cache:'no-store'})).json();for(const a of['CEO-002','D1','D2']){const el=a==='CEO-002'?$('ceo'):$(a.toLowerCase());el.className='seat '+(j.agents?.[a]?'on':'')} $('status').textContent=j.discussion_mode?'一家人開會模式 READY':'開會模式未接通';$('status').className=j.discussion_mode?'ok':'bad';log('系統：Family Discussion='+(j.discussion_mode?'READY':'PENDING')+'；002='+(j.agents?.['CEO-002']?'READY':'PENDING')+'；D1='+(j.agents?.D1?'READY':'PENDING')+'；D2='+(j.agents?.D2?'READY':'PENDING'));log('聲音：002／小晴／阿凱已啟用固定 Voice Profile + 動態 Prosody。')}catch(e){$('status').textContent='檢查失敗';$('status').className='bad';log('[HEALTH] '+e.message)}}async function general(text){const r=await fetch('/api/conference',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,session_id:session})}),j=await r.json();if(!r.ok)throw Error(j.detail||j.error||r.status);for(const t of j.turns||[]){if(stopped)return;if(!t.reply)continue;log('['+(t.agent_name||t.agent)+'] '+t.reply);if($('mode').value==='browser'||t.agent==='CEO-002')await speakLocal(t.reply,t.agent);else await playCloud(await callInworld(t.reply,t.agent,$('mode').value),t.agent)}}async function familyMeeting(topic){if(busy)return;busy=true;stopped=false;$('status').textContent='一家人正在討論…';log('\n[001 何董事長／議題] '+topic);try{const r=await fetch('/api/discussion',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:topic,session_id:session,voice_style:$('voiceStyle').value})}),j=await r.json();if(!r.ok)throw Error(j.detail||j.error||r.status);for(const t of j.turns||[]){if(stopped)break;if(!t.reply)continue;log('['+(t.agent_name||t.agent)+'] '+t.reply);if($('mode').value==='browser'||t.agent==='CEO-002')await speakLocal(t.reply,t.agent);else await playCloud(await callInworld(t.reply,t.agent,$('mode').value),t.agent)}await refreshShared();$('status').textContent=stopped?'已停止':'本輪討論完成 · 可直接插話或下一題';$('status').className='ok'}catch(e){$('status').textContent='開會模式錯誤';$('status').className='bad';log('[ERROR] '+e.message)}finally{busy=false}}async function sendGeneral(){const t=$('txt').value.trim();if(!t||busy)return;busy=true;stopped=false;log('\n[001 何董事長] '+t);try{await general(t);await refreshShared();$('status').textContent='完成';$('status').className='ok'}catch(e){log('[ERROR] '+e.message)}finally{busy=false}}$('meeting').onclick=()=>familyMeeting($('txt').value.trim()||'大哥，今天工作匯報，大家一起討論一下');$('send').onclick=sendGeneral;$('txt').addEventListener('keydown',e=>{if(e.key==='Enter')sendGeneral()});$('stop').onclick=()=>{stopped=true;speechSynthesis.cancel();if(currentAudio){currentAudio.pause();currentAudio=null}$('status').textContent='已停止'};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;$('mic').onclick=()=>{if(!SR)return alert('請用 Chrome 開啟語音辨識');const r=new SR();r.lang='zh-TW';r.interimResults=false;r.onstart=()=>{$('mic').className='primary listening';$('status').textContent='正在聽你說話…'};r.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript?.trim()||'';$('txt').value=t;$('mic').className='primary';if(/開會|讨论|討論|工作匯報|工作汇报|大家一起/.test(t))familyMeeting(t);else sendGeneral()};r.onend=()=>{$('mic').className='primary'};r.start()};speechSynthesis.onvoiceschanged=()=>{lockVoice('CEO-002');lockVoice('D1');lockVoice('D2')};health();refreshShared();setInterval(refreshShared,1500);</script></body></html>
