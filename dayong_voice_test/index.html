<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大用 AI 語音會議</title><style>body{font-family:system-ui;background:#111;color:#eee;max-width:860px;margin:20px auto;padding:16px}.card{background:#1c1c1c;border:1px solid #333;border-radius:16px;padding:16px;margin:12px 0}button,input,select{font-size:17px;padding:13px;border-radius:10px;border:1px solid #555;background:#222;color:#fff;margin:4px}.primary{background:#1769d2}.seat{display:inline-block;padding:9px 13px;border:1px solid #555;border-radius:10px;margin:4px}.on{border-color:#58d68d}.speaking{border-color:#ffd166;background:#332b12}.ok{color:#7dff9c}.bad{color:#ff8888}.muted{color:#aaa;font-size:14px}#log{white-space:pre-wrap;background:#090909;padding:12px;border-radius:10px;min-height:210px}.listening{background:#8b1e1e!important}</style></head><body><h1>大用 AI D1 / D2 語音會議</h1><div class="card"><span class="seat" id="d1">D1 小晴 · Sarah</span><span class="seat" id="d2">D2 阿凱 · Dennis</span><div class="muted">Standard：DeepSeek 思考＋Inworld 固定聲線　｜　Realtime：Inworld 即時對話＋固定聲線</div></div><div class="card"><select id="mode"><option value="standard">Inworld Standard</option><option value="realtime" selected>Inworld Realtime</option><option value="browser">Browser TTS 備援</option></select><br><button class="primary" id="mic">🎙 開始說話</button><button id="stop">停止</button><br><input id="txt" style="width:72%" placeholder="例如：小晴在嗎？／阿凱你覺得呢？／你們兩個說說看"><button id="send">送出</button><div class="muted">現在支援連續多輪：每次回答播放完畢後，可以直接再按麥克風說下一句。</div></div><div class="card">狀態：<span id="status">檢查中</span><div id="log"></div></div><script>const $=x=>document.getElementById(x),log=x=>$('log').textContent+=x+'\n';let session=crypto.randomUUID(),currentAudio=null,busy=false,listening=false,recognition=null;function setMic(){const b=$('mic');b.disabled=busy;b.className=listening?'primary listening':'primary';b.textContent=listening?'🎙 聆聽中…':'🎙 開始說話'}function pickVoice(agent){const vs=speechSynthesis.getVoices(),zh=vs.filter(v=>/^zh/i.test(v.lang));if(agent==='D1')return zh.find(v=>/Hsiao|Yating|Mei|Ting|Female|女/i.test(v.name))||zh[0]||null;return zh.find(v=>/YunJhe|Yunjian|Zhiwei|Male|男/i.test(v.name))||zh[1]||zh[0]||null}function browserSpeak(t,a){return new Promise(r=>{if(!t)return r();const el=$(a.toLowerCase());el.className='seat on speaking';const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.voice=pickVoice(a);u.rate=a==='D1'?1.04:.96;u.pitch=a==='D1'?1.08:.92;u.onend=u.onerror=()=>{el.className='seat on';r()};speechSynthesis.speak(u)})}function b64blob(b64,type='audio/wav'){const bin=atob(b64),len=bin.length,bytes=new Uint8Array(len);for(let i=0;i<len;i++)bytes[i]=bin.charCodeAt(i);return new Blob([bytes],{type})}async function playCloud(result,agent){if(!result?.audioContent)throw Error('Inworld 沒有回傳音訊');const el=$(agent.toLowerCase());el.className='seat on speaking';const url=URL.createObjectURL(b64blob(result.audioContent,result.contentType||'audio/wav'));currentAudio=new Audio(url);await new Promise((resolve,reject)=>{currentAudio.onended=resolve;currentAudio.onerror=()=>reject(Error('手機播放失敗'));currentAudio.play().catch(reject)}).finally(()=>{URL.revokeObjectURL(url);el.className='seat on';currentAudio=null})}function routeAgents(text){const d1=/小晴|小琴|\bD1\b|第一位/i.test(text),d2=/阿凱|阿凯|\bD2\b|第二位/i.test(text),both=/你們|你们|兩個|两个|大家|各自|一起|二位|兩位/.test(text)||(d1&&d2);if(both)return['D1','D2'];if(d2)return['D2'];return['D1']}async function callInworld(text,agent,mode){const r=await fetch('/api/inworld',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,agent,mode,session_id:session})});const j=await r.json();if(!r.ok)throw Error(j.detail||j.error||r.status);return j.result}async function health(){try{const j=await(await fetch('/api/health')).json();for(const a of['D1','D2'])$(a.toLowerCase()).className='seat '+(j.agents?.[a]?'on':'off');if(j.inworld_queue){$('status').textContent='D1 / D2 + Inworld 已接通';$('status').className='ok';log('系統：DeepSeek 與 Inworld 語音管線已接通。小晴=Sarah；阿凱=Dennis。')}else{throw Error('Inworld queue 尚未接通')}}catch(e){$('status').textContent='語音管線檢查失敗';$('status').className='bad';log('[HEALTH] '+e.message)}}async function standardFlow(text){const r=await fetch('/api/conference',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,session_id:session})});const j=await r.json();if(!r.ok)throw Error(j.detail||j.error||r.status);for(const t of j.turns||[]){if(!t.reply)continue;log('['+(t.agent_name||t.agent)+'] '+t.reply);$('status').textContent='Inworld 生成聲音中…';try{const v=await callInworld(t.reply,t.agent,'standard');await playCloud(v,t.agent)}catch(e){log('[Inworld Standard 備援] '+e.message);await browserSpeak(t.reply,t.agent)}}}async function realtimeFlow(text){const agents=routeAgents(text);for(const agent of agents){$('status').textContent=(agent==='D1'?'小晴':'阿凱')+' Realtime 回應中…';const v=await callInworld(text,agent,'realtime');const name=agent==='D1'?'D1 小晴':'D2 阿凱';if(v.transcript)log('['+name+'] '+v.transcript);else log('['+name+'] Realtime 語音回覆');await playCloud(v,agent)}}async function browserFlow(text){const r=await fetch('/api/conference',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,session_id:session})});const j=await r.json();if(!r.ok)throw Error(j.detail||j.error||r.status);for(const t of j.turns||[]){if(t.reply){log('['+(t.agent_name||t.agent)+'] '+t.reply);await browserSpeak(t.reply,t.agent)}}}async function go(text){if(!text||busy)return;busy=true;listening=false;setMic();log('\n[何董事長] '+text);$('status').textContent='處理中…';$('status').className='';try{const mode=$('mode').value;if(mode==='standard')await standardFlow(text);else if(mode==='realtime')await realtimeFlow(text);else await browserFlow(text);$('status').textContent='完成，可以繼續說下一句';$('status').className='ok'}catch(e){$('status').textContent='後端錯誤';$('status').className='bad';log('[ERROR] '+e.message)}finally{busy=false;setMic()}}$('send').onclick=()=>go($('txt').value.trim());$('txt').addEventListener('keydown',e=>{if(e.key==='Enter')go($('txt').value.trim())});$('stop').onclick=()=>{try{recognition?.abort()}catch{};listening=false;speechSynthesis.cancel();if(currentAudio){currentAudio.pause();currentAudio=null}busy=false;setMic();$('status').textContent='已停止'};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;function startListening(){if(!SR||busy||listening)return;if(recognition){try{recognition.abort()}catch{}}recognition=new SR();recognition.lang='zh-TW';recognition.interimResults=false;recognition.continuous=false;recognition.maxAlternatives=1;recognition.onstart=()=>{listening=true;setMic();$('status').textContent='正在聽你說話…'};recognition.onresult=e=>{const text=e.results?.[0]?.[0]?.transcript?.trim()||'';if(text){$('txt').value=text;go(text)}};recognition.onerror=e=>{if(e.error!=='aborted'&&e.error!=='no-speech')log('[MIC] '+e.error)};recognition.onend=()=>{listening=false;setMic();if(!busy&&$('status').textContent==='正在聽你說話…')$('status').textContent='可以再按麥克風繼續說'};try{recognition.start()}catch(e){listening=false;setMic();log('[MIC] '+e.message)}}if(SR)$('mic').onclick=startListening;else $('mic').onclick=()=>alert('請用 Chrome 開啟以使用語音辨識');speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();health();setMic();</script></body></html>
