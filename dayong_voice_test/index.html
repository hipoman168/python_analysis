<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大用 AI 語音會議</title><style>body{font-family:system-ui;background:#111;color:#eee;max-width:860px;margin:20px auto;padding:16px}.card{background:#1c1c1c;border:1px solid #333;border-radius:16px;padding:16px;margin:12px 0}button,input{font-size:17px;padding:13px;border-radius:10px;border:1px solid #555;background:#222;color:#fff;margin:4px}.primary{background:#1769d2}.seat{display:inline-block;padding:9px 13px;border:1px solid #555;border-radius:10px;margin:4px}.on{border-color:#58d68d}.speaking{border-color:#ffd166;background:#332b12}.ok{color:#7dff9c}.bad{color:#ff8888}#log{white-space:pre-wrap;background:#090909;padding:12px;border-radius:10px;min-height:180px}</style></head><body><h1>大用 AI D1 / D2 自然語音會議</h1><div class="card"><span class="seat" id="d1">D1 小晴</span><span class="seat" id="d2">D2 阿凱</span></div><div class="card"><button class="primary" id="mic">🎙 開始說話</button><button id="stop">停止</button><br><input id="txt" style="width:72%" placeholder="例如：小晴在嗎？／阿凱你覺得呢？／你們兩個說說看"><button id="send">送出</button></div><div class="card">狀態：<span id="status">檢查中</span><div id="log"></div></div><script>const $=x=>document.getElementById(x),log=x=>$('log').textContent+=x+'\n';let session=crypto.randomUUID();function pickVoice(agent){const vs=speechSynthesis.getVoices();const zh=vs.filter(v=>/^zh/i.test(v.lang));if(agent==='D1')return zh.find(v=>/Hsiao|Yating|Mei|Ting|Female|女/i.test(v.name))||zh[0]||null;return zh.find(v=>/YunJhe|Yunjian|Zhiwei|Male|男/i.test(v.name))||zh[1]||zh[0]||null}function speak(t,a){return new Promise(r=>{if(!t)return r();const el=$(a.toLowerCase());el.className='seat on speaking';const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.voice=pickVoice(a);u.rate=a==='D1'?1.04:.96;u.pitch=a==='D1'?1.08:.92;u.onend=()=>{el.className='seat on';r()};u.onerror=()=>{el.className='seat on';r()};speechSynthesis.speak(u)})}async function health(){try{const j=await (await fetch('/api/health')).json();for(const a of ['D1','D2'])$(a.toLowerCase()).className='seat '+(j.agents?.[a]?'on':'off');$('status').textContent='D1 / D2 已接通';$('status').className='ok';log('系統：小晴、阿凱已上線。點名誰就由誰回答；說「你們兩個」才會兩人回答。')}catch(e){$('status').textContent='Gateway 未連線';$('status').className='bad';log(e.message)}}async function go(text){if(!text)return;log('\n[何董事長] '+text);$('status').textContent='思考中…';try{const r=await fetch('/api/conference',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,session_id:session})});const j=await r.json();if(!r.ok)throw Error(j.detail||j.error||r.status);for(const t of j.turns||[]){if(t.reply){log('['+t.agent_name+'] '+t.reply);await speak(t.reply,t.agent)}}$('status').textContent='完成'}catch(e){$('status').textContent='後端錯誤';$('status').className='bad';log('[ERROR] '+e.message)}}$('send').onclick=()=>go($('txt').value.trim());$('stop').onclick=()=>speechSynthesis.cancel();const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const r=new SR();r.lang='zh-TW';r.interimResults=false;r.onresult=e=>go(e.results[0][0].transcript);r.onerror=e=>log('[MIC] '+e.error);$('mic').onclick=()=>r.start()}else $('mic').onclick=()=>alert('請用 Chrome 開啟以使用語音辨識');speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();health();</script></body></html>
