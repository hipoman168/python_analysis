<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大用一家人通話窗口</title><style>body{font-family:system-ui;background:#111;color:#eee;max-width:920px;margin:20px auto;padding:16px}.card{background:#1c1c1c;border:1px solid #333;border-radius:16px;padding:16px;margin:12px 0}button,input,select{font-size:17px;padding:13px;border-radius:10px;border:1px solid #555;background:#222;color:#fff;margin:4px}.primary{background:#1769d2}.meeting{background:#6d3cc3}.seat{display:inline-block;padding:9px 13px;border:1px solid #555;border-radius:10px;margin:4px}.on{border-color:#58d68d}.speaking{border-color:#ffd166;background:#332b12}.ok{color:#7dff9c}.bad{color:#ff8888}.muted{color:#aaa;font-size:14px}#log,#shared{white-space:pre-wrap;background:#090909;padding:12px;border-radius:10px;min-height:180px;max-height:360px;overflow:auto}.listening{background:#8b1e1e!important}</style></head><body><h1>大用一家人通話窗口</h1><div class="card"><span class="seat on">001 何董事長 · 真人</span><span class="seat" id="ceo">002 陳啟航 · 大哥</span><span class="seat" id="d1">D1 小晴 · 二姐</span><span class="seat" id="d2">D2 阿凱 · 三弟</span><div class="muted">一家人共用 DAYONG-FAMILY-ROOM。大哥主持、二姐與三弟主動接話，討論不是輪流念答案。</div></div><div class="card"><select id="mode"><option value="browser" selected>⚡ 固定本機 TTS</option><option value="realtime">Inworld Realtime</option><option value="standard">Inworld Standard</option></select><br><button class="meeting" id="meeting">👨‍👩‍👧‍👦 一家人開會模式</button><button class="primary" id="mic">🎙 開始說話</button><button id="stop">停止</button><br><input id="txt" style="width:72%" value="大哥，今天工作匯報，大家一起討論一下" placeholder="例如：大哥，今天工作匯報，大家一起討論一下"><button id="send">一般送出</button><div class="muted">開會模式：大哥開場 → 小晴回應 → 阿凱補充 → 大哥收斂。任何時候董事長都可以插話。</div></div><div class="card">即時狀態：<span id="status">檢查中</span><div id="log"></div></div><div class="card"><b>一家人共享訊息</b><div class="muted">中央 Room Transcript，約每 1.5 秒刷新。</div><div id="shared">載入中…</div></div><script>const $=x=>document.getElementById(x),log=x=>{$('log').textContent+=x+'\n';$('log').scrollTop=$('log').scrollHeight};let session=crypto.randomUUID(),busy=false,stopped=false,currentAudio=null,lastShared='';const PROFILE={"CEO-002":{label:'002 陳啟航',rate:.98,pitch:.86,gender:'male',store:'voice_ceo'},D1:{label:'D1 小晴',rate:1.07,pitch:1.08,gender:'female',store:'voice_d1'},D2:{label:'D2 阿凱',rate:1.00,pitch:.93,gender:'male',store:'voice_d2'}};function allVoices(){return speechSynthesis.getVoices().filter(v=>/^zh/i.test(v.lang))}function scoreVoice(v,p){const n=v.name.toLowerCase();let s=0;if(/^zh-TW/i.test(v.lang))s+=8;if(p.gender==='female'&&/female|女|hsiao|yating|mei|ting|xiaoxiao|huihui|hanhan/i.test(n))s+=10;if(p.gender==='male'&&/male|男|yunjhe|yunjian|zhiwei|yunxi|yunyang|yunfeng/i.test(n))s+=10;return s}function lockVoice(agent){const p=PROFILE[agent],vs=allVoices(),saved=localStorage.getItem(p.store);if(saved){const hit=vs.find(v=>v.name===saved);if(hit)return hit}const ranked=[...vs].sort((a,b)=>scoreVoice(b,p)-scoreVoice(a,p));let pick=ranked[0]||null;if(agent==='D2'){const ceo=localStorage.getItem(PROFILE['CEO-002'].store);const alt=ranked.find(v=>v.name!==ceo);if(alt)pick=alt}if(pick)localStorage.setItem(p.store,pick.name);return pick}function speakLocal(text,agent){return new Promise(r=>{if(!text||stopped)return r();const p=PROFILE[agent]||PROFILE.D1,el=agent==='CEO-002'?$('ceo'):$(agent.toLowerCase());if(el)el.className='seat on speaking';const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.voice=lockVoice(agent);u.rate=p.rate;u.pitch=p.pitch;u.volume=1;u.onend=u.onerror=()=>{if(el)el.className='seat on';r()};speechSynthesis.speak(u)})}function b64blob(b64,type='audio/wav'){const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new Blob([bytes],{type})}async function playCloud(result,agent){if(!result?.audioContent)throw Error('Inworld 沒有回傳音訊');const el=$(agent.toLowerCase()),url=URL.createObjectURL(b64blob(result.audioContent,result.contentType||'audio/wav'));if(el)el.className='seat on speaking';currentAudio=new Audio(url);await new Promise((res,rej)=>{currentAudio.onended=res;currentAudio.onerror=rej;currentAudio.play().catch(rej)}).finally(()=>{URL.revokeObjectURL(url);if(el)el.className='seat on';currentAudio=null})}async function callInworld(text,agent,mode){const a=agent==='CEO-002'?'D2':agent;const r=await fetch('/api/inworld',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,agent:a,mode,session_id:session})});const j=await r.json();if(!r.ok)throw Error(j.detail||j.error||r.status);return j.result}function formatShared(m){return '['+(m.sender_name||m.sender_id)+(m.recipient_id?' → '+m.recipient_id:'')+'] '+m.content}async function refreshShared(){try{const r=await fetch('/api/family/messages?limit=80',{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)return;const t=(j.messages||[]).map(formatShared).join('\n');if(t!==lastShared){lastShared=t;$('shared').textContent=t||'尚無訊息';$('shared').scrollTop=$('shared').scrollHeight}}catch{}}async function health(){try{const j=await(await fetch('/api/health',{cache:'no-store'})).json();for(const a of['CEO-002','D1','D2']){const el=a==='CEO-002'?$('ceo'):$(a.toLowerCase());el.className='seat '+(j.agents?.[a]?'on':'')} $('status').textContent=j.discussion_mode?'一家人開會模式 READY':'開會模式未接通';$('status').className=j.discussion_mode?'ok':'bad';log('系統：Family Discussion='+(j.discussion_mode?'READY':'PENDING')+'；002='+(j.agents?.['CEO-002']?'READY':'PENDING')+'；D1='+(j.agents?.D1?'READY':'PENDING')+'；D2='+(j.agents?.D2?'READY':'PENDING'));if(j.ceo_provider_role_fallback)log('系統：002 目前使用共同模型資源作主持 Runtime；GPT 專屬 Bridge 後續可替換，不影響會議流程。')}catch(e){$('status').textContent='檢查失敗';$('status').className='bad';log('[HEALTH] '+e.message)}}async function general(text){const r=await fetch('/api/conference',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,session_id:session})}),j=await r.json();if(!r.ok)throw Error(j.detail||j.error||r.status);for(const t of j.turns||[]){if(stopped)return;if(!t.reply)continue;log('['+(t.agent_name||t.agent)+'] '+t.reply);if($('mode').value==='browser'||t.agent==='CEO-002')await speakLocal(t.reply,t.agent);else await playCloud(await callInworld(t.reply,t.agent,$('mode').value),t.agent)}}async function familyMeeting(topic){if(busy)return;busy=true;stopped=false;$('status').textContent='一家人正在討論…';log('\n[001 何董事長／議題] '+topic);try{const r=await fetch('/api/discussion',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:topic,session_id:session})}),j=await r.json();if(!r.ok)throw Error(j.detail||j.error||r.status);for(const t of j.turns||[]){if(stopped)break;if(!t.reply)continue;log('['+(t.agent_name||t.agent)+'] '+t.reply);if($('mode').value==='browser'||t.agent==='CEO-002')await speakLocal(t.reply,t.agent);else await playCloud(await callInworld(t.reply,t.agent,$('mode').value),t.agent);await new Promise(x=>setTimeout(x,180))}await refreshShared();$('status').textContent=stopped?'已停止':'本輪討論完成 · 可直接插話或下一題';$('status').className='ok'}catch(e){$('status').textContent='開會模式錯誤';$('status').className='bad';log('[ERROR] '+e.message)}finally{busy=false}}async function sendGeneral(){const t=$('txt').value.trim();if(!t||busy)return;busy=true;stopped=false;log('\n[001 何董事長] '+t);try{await general(t);await refreshShared();$('status').textContent='完成';$('status').className='ok'}catch(e){log('[ERROR] '+e.message)}finally{busy=false}}$('meeting').onclick=()=>familyMeeting($('txt').value.trim()||'大哥，今天工作匯報，大家一起討論一下');$('send').onclick=sendGeneral;$('txt').addEventListener('keydown',e=>{if(e.key==='Enter')sendGeneral()});$('stop').onclick=()=>{stopped=true;speechSynthesis.cancel();if(currentAudio){currentAudio.pause();currentAudio=null}$('status').textContent='已停止'};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;$('mic').onclick=()=>{if(!SR)return alert('請用 Chrome 開啟語音辨識');const r=new SR();r.lang='zh-TW';r.interimResults=false;r.onstart=()=>{$('mic').className='primary listening';$('status').textContent='正在聽你說話…'};r.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript?.trim()||'';$('txt').value=t;$('mic').className='primary';if(/開會|讨论|討論|工作匯報|工作汇报|大家一起/.test(t))familyMeeting(t);else sendGeneral()};r.onend=()=>{$('mic').className='primary'};r.start()};speechSynthesis.onvoiceschanged=()=>{lockVoice('CEO-002');lockVoice('D1');lockVoice('D2')};health();refreshShared();setInterval(refreshShared,1500);</script></body></html>
