<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAYONG D1/D2 語音測試</title><style>body{font-family:system-ui;background:#111;color:#eee;max-width:860px;margin:24px auto;padding:16px}.card{background:#1c1c1c;border:1px solid #333;border-radius:16px;padding:16px;margin:12px 0}button,input{font-size:17px;padding:13px;border-radius:10px;border:1px solid #555;background:#222;color:#fff;margin:4px}.primary{background:#1769d2}.seat{display:inline-block;padding:8px 12px;border:1px solid #555;border-radius:10px;margin:4px}.on{border-color:#58d68d}.off{opacity:.5}.ok{color:#7dff9c}.bad{color:#ff8888}#log{white-space:pre-wrap;background:#090909;padding:12px;border-radius:10px;min-height:180px}</style></head><body><h1>大用 AI D1 / D2 語音測試</h1><div class="card"><span class="seat" id="d1">D1 小晴</span><span class="seat" id="d2">D2 阿凱</span></div><div class="card"><button class="primary" id="mic">🎙 開始說話</button><button id="stop">停止</button><br><input id="txt" style="width:72%" placeholder="例如：小晴、阿凱，請各自自我介紹"><button id="send">送出</button></div><div class="card">狀態：<span id="status">檢查中</span><div id="log"></div></div><script>const $=x=>document.getElementById(x),log=x=>$('log').textContent+=x+'\n';function speak(t,a){return new Promise(r=>{if(!t)return r();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=a==='D1'?1.03:.96;u.pitch=a==='D1'?1.18:.82;u.onend=r;u.onerror=r;speechSynthesis.speak(u)})}async function health(){try{const j=await (await fetch('/api/health')).json();for(const a of ['D1','D2']){const e=$(a.toLowerCase());e.className='seat '+(j.agents?.[a]?'on':'off')} $('status').textContent='Gateway 已上線';$('status').className='ok';log(JSON.stringify(j))}catch(e){$('status').textContent='Gateway 未連線';$('status').className='bad';log(e.message)}}async function go(text){if(!text)return;log('[何董事長] '+text);$('status').textContent='D1/D2 回應中';try{const r=await fetch('/api/conference',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,session_id:crypto.randomUUID()})});const j=await r.json();if(!r.ok)throw Error(j.detail||j.error||r.status);for(const t of j.turns||[]){if(t.agent==='CEO-002')continue;if(t.reply){log('['+t.agent_name+'] '+t.reply);await speak(t.reply,t.agent)}else log('['+t.agent_name+'] 尚未接通')} $('status').textContent='完成'}catch(e){$('status').textContent='後端錯誤';$('status').className='bad';log('[ERROR] '+e.message)}}$('send').onclick=()=>go($('txt').value.trim());$('stop').onclick=()=>speechSynthesis.cancel();const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const r=new SR();r.lang='zh-TW';r.onresult=e=>go(e.results[0][0].transcript);r.onerror=e=>log('[MIC] '+e.error);$('mic').onclick=()=>r.start()}else $('mic').onclick=()=>alert('請用 Chrome 開啟以使用語音辨識');health();</script></body></html>
