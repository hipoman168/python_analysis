<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大用 AI 語音會議</title><style>body{font-family:system-ui;background:#111;color:#eee;max-width:860px;margin:20px auto;padding:16px}.card{background:#1c1c1c;border:1px solid #333;border-radius:16px;padding:16px;margin:12px 0}button,input,select{font-size:17px;padding:13px;border-radius:10px;border:1px solid #555;background:#222;color:#fff;margin:4px}.primary{background:#1769d2}.seat{display:inline-block;padding:9px 13px;border:1px solid #555;border-radius:10px;margin:4px}.on{border-color:#58d68d}.speaking{border-color:#ffd166;background:#332b12}.ok{color:#7dff9c}.bad{color:#ff8888}.muted{color:#aaa;font-size:14px}#log{white-space:pre-wrap;background:#090909;padding:12px;border-radius:10px;min-height:210px}.listening{background:#8b1e1e!important}.toggleOn{background:#1769d2}</style></head><body><h1>大用 AI D1 / D2 語音會議</h1><div class="card"><span class="seat" id="d1">D1 小晴 · 女聲</span><span class="seat" id="d2">D2 阿凱 · 男聲</span><div class="muted">速度優先：預設使用本機 TTS，先把接話速度做到像聊天；Inworld 保留做高品質聲線比較。</div></div><div class="card"><select id="mode"><option value="browser" selected>⚡ 本機 TTS 極速模式</option><option value="realtime">Inworld Realtime</option><option value="standard">Inworld Standard</option></select><br><button class="primary" id="mic">🎙 開始聊天</button><button class="toggleOn" id="continuous">🔁 連續聊天：開</button><button id="stop">停止</button><br><input id="txt" style="width:72%" placeholder="例如：小晴在嗎？／阿凱你覺得呢？"><button id="send">送出</button><div class="muted">回答播放完會自動恢復聆聽；對方說話時可直接按麥克風插話。</div></div><div class="card">狀態：<span id="status">檢查中</span><div id="log"></div></div><script>const $=x=>document.getElementById(x),log=x=>$('log').textContent+=x+'\n';let session=crypto.randomUUID(),currentAudio=null,busy=false,listening=false,recognition=null,continuous=true,stopped=false,turnStart=0,firstAudioLogged=false;function setMic(){const b=$('mic');b.className=listening?'primary listening':'primary';b.textContent=listening?'🎙 聆聽中…':(busy?'🎙 插話':'🎙 開始聊天');$('continuous').className=continuous?'toggleOn':'';$('continuous').textContent='🔁 連續聊天：'+(continuous?'開':'關')}function pickVoice(agent){const vs=speechSynthesis.getVoices(),zhTW=vs.filter(v=>/^zh-TW/i.test(v.lang)),zh=vs.filter(v=>/^zh/i.test(v.lang)),pool=zhTW.length?zhTW:zh;if(agent==='D1')return pool.find(v=>/Hsiao|Yating|Mei|Ting|Female|女|Xiaoxiao/i.test(v.name))||pool[0]||null;return pool.find(v=>/YunJhe|Yunjian|Zhiwei|Male|男|Yunxi/i.test(v.name))||pool[1]||pool[0]||null}function markFirstAudio(){if(!firstAudioLogged&&turnStart){firstAudioLogged=true;const ms=Math.round(performance.now()-turnStart);log('[速度] 首聲 '+ms+' ms');$('status').textContent='已開口 · '+ms+' ms'}}function browserSpeak(t,a){return new Promise(r=>{if(!t)return r();const el=$(a.toLowerCase());el.className='seat on speaking';const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.voice=pickVoice(a);u.rate=a==='D1'?1.08:1.02;u.pitch=a==='D1'?1.06:.94;u.volume=1;u.onstart=markFirstAudio;u.onend=u.onerror=()=>{el.className='seat on';r()};speechSynthesis.speak(u)})}function b64blob(b64,type='audio/wav'){const bin=atob(b64),len=bin.length,bytes=new Uint8Array(len);for(let i=0;i<len;i++)bytes[i]=bin.charCodeAt(i);return new Blob([bytes],{type})}async function playCloud(result,agent){if(!result?.audioContent)throw Error('Inworld 沒有回傳音訊');const el=$(agent.toLowerCase());el.className='seat on speaking';const url=URL.createObjectURL(b64blob(result.audioContent,result.contentType||'audio/wav'));currentAudio=new Audio(url);await new Promise((resolve,reject)=>{currentAudio.onplaying=markFirstAudio;currentAudio.onended=resolve;currentAudio.onerror=()=>reject(Error('手機播放失敗'));currentAudio.play().catch(reject)}).finally(()=>{URL.revokeObjectURL(url);el.className='seat on';currentAudio=null})}function routeAgents(text){const d1=/小晴|小琴|\bD1\b|第一位/i.test(text),d2=/阿凱|阿凯|\bD2\b|第二位/i.test(text),both=/你們|你们|兩個|两个|大家|各自|一起|二位|兩位/.test(text)||(d1&&d2);if(both)return['D1','D2'];if(d2)return['D2'];return['D1']}async function callInworld(text,agent,mode){const r=await fetch('/api/inworld',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,agent,mode,session_id:session})});const j=await r.json();if(!r.ok)throw Error(j.detail||j.error||r.status);return j.result}async function health(){try{const j=await(await fetch('/api/health')).json();for(const a of['D1','D2'])$(a.toLowerCase()).className='seat '+(j.agents?.[a]?'on':'off');$('status').textContent='極速聊天模式已接通';$('status').className='ok';log('系統：本機 TTS 極速模式已啟動；小晴女聲、阿凱男聲。')}catch(e){$('status').textContent='語音管線檢查失敗';$('status').className='bad';log('[HEALTH] '+e.message)}}async function standardFlow(text){const r=await fetch('/api/conference',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,session_id:session})});const j=await r.json();if(!r.ok)throw Error(j.detail||j.error||r.status);for(const t of j.turns||[]){if(!t.reply)continue;log('['+(t.agent_name||t.agent)+'] '+t.reply);const v=await callInworld(t.reply,t.agent,'standard');await playCloud(v,t.agent)}}async function realtimeFlow(text){for(const agent of routeAgents(text)){if(stopped)return;$('status').textContent=(agent==='D1'?'小晴':'阿凱')+' 回應中…';const v=await callInworld(text,agent,'realtime');const name=agent==='D1'?'D1 小晴':'D2 阿凱';if(v.transcript)log('['+name+'] '+v.transcript);await playCloud(v,agent)}}async function browserFlow(text){const r=await fetch('/api/conference',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,session_id:session})});const j=await r.json();if(!r.ok)throw Error(j.detail||j.error||r.status);for(const t of j.turns||[]){if(stopped)return;if(t.reply){log('['+(t.agent_name||t.agent)+'] '+t.reply);await browserSpeak(t.reply,t.agent)}}}async function go(text){if(!text||busy)return;busy=true;listening=false;stopped=false;turnStart=performance.now();firstAudioLogged=false;setMic();log('\n[何董事長] '+text);$('status').textContent='接話中…';$('status').className='';try{const mode=$('mode').value;if(mode==='standard')await standardFlow(text);else if(mode==='realtime')await realtimeFlow(text);else await browserFlow(text);if(!stopped){$('status').textContent=continuous?'換你說…':'完成';$('status').className='ok'}}catch(e){$('status').textContent='後端錯誤';$('status').className='bad';log('[ERROR] '+e.message)}finally{busy=false;setMic();if(continuous&&!stopped)setTimeout(startListening,120)}}function interrupt(){stopped=true;try{recognition?.abort()}catch{};speechSynthesis.cancel();if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;currentAudio=null}busy=false;listening=false;setMic()}$('send').onclick=()=>go($('txt').value.trim());$('txt').addEventListener('keydown',e=>{if(e.key==='Enter')go($('txt').value.trim())});$('continuous').onclick=()=>{continuous=!continuous;setMic()};$('stop').onclick=()=>{continuous=false;interrupt();$('status').textContent='已停止';setMic()};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let micWatchdog=null;function armMicWatchdog(){clearTimeout(micWatchdog);micWatchdog=setTimeout(()=>{if(continuous&&!busy&&!stopped&&!listening)startListening()},900)}function startListening(){if(!SR||listening||stopped)return;if(busy)interrupt();stopped=false;if(recognition){try{recognition.abort()}catch{}}recognition=new SR();recognition.lang='zh-TW';recognition.interimResults=false;recognition.continuous=false;recognition.maxAlternatives=1;recognition.onstart=()=>{listening=true;setMic();$('status').textContent='正在聽你說話…'};recognition.onresult=e=>{const text=e.results?.[0]?.[0]?.transcript?.trim()||'';if(text){$('txt').value=text;listening=false;setMic();go(text)}};recognition.onerror=e=>{listening=false;if(e.error!=='aborted'&&e.error!=='no-speech')log('[MIC] '+e.error);armMicWatchdog()};recognition.onend=()=>{listening=false;setMic();if(!busy&&continuous&&!stopped)armMicWatchdog()};try{recognition.start()}catch(e){listening=false;log('[MIC] '+e.message);armMicWatchdog()}}$('mic').onclick=()=>{if(busy)interrupt();stopped=false;startListening()};if(!SR)$('mic').onclick=()=>alert('請用 Chrome 開啟以使用語音辨識');speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();health();setMic();</script></body></html>
