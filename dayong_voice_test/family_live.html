<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大用一家人｜單一話題練習</title><style>body{font-family:system-ui;background:#111;color:#eee;max-width:900px;margin:auto;padding:18px}.card{background:#1c1c1c;border:1px solid #333;border-radius:16px;padding:16px;margin:12px 0}.seat{display:inline-block;padding:10px;margin:4px;border:1px solid #58d68d;border-radius:10px}.speaking{background:#443814}.chair{border-color:#f5b041}button,input{font-size:18px;padding:13px;border-radius:10px;border:1px solid #555;background:#222;color:#fff;margin:4px}.go{background:#6d3cc3}button:disabled{opacity:.5}input{width:70%}#log{white-space:pre-wrap;background:#080808;padding:12px;border-radius:10px;min-height:280px;max-height:520px;overflow:auto}.ok{color:#7dff9c}.hint{color:#bbb}</style></head><body><h1>👨‍👩‍👧‍👦 大用一家人｜單一話題練習</h1><div class="card"><span class="seat">001 何董事長</span><span class="seat chair" id="CEO-002">002 陳啟航 · 主持人</span><span class="seat" id="D1">D1 小晴</span><span class="seat" id="D2">D2 阿凱</span><p class="ok">練習目標：先練默契，不追求完整正式會議。</p><p class="hint">一個話題就是一個 Discussion Unit：主持人開題 → 最相關的人先說 → 其他人自然接話／質疑／補充 → 主持人適時追問與收斂。可以不同意，可以沒話就不說，不強求共識，也不自動產生 WorkOrder。</p></div><div class="card"><input id="txt" value="我們自己的 TTS 接下來應該先追求自然度，還是先追求穩定上線？"><button class="go" id="meeting">開始單一話題練習</button><button id="stop">停止</button><p id="status">READY</p></div><div class="card"><div id="log">系統：單一話題練習已就緒。\n</div></div><script>const $=x=>document.getElementById(x);let stopped=false,audio=null,busy=false,runToken=0;const wait=ms=>new Promise(r=>setTimeout(r,ms));function log(x){$('log').textContent+=x+'\n';$('log').scrollTop=$('log').scrollHeight}function blob(b64,t='audio/wav'){const b=atob(b64),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Blob([u],{type:t})}async function speak(text,role,token){if(stopped||token!==runToken)return;const r=await fetch('/api/fixed-voice',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({role,text})}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.detail||j.error||r.status);if(stopped||token!==runToken)return;const url=URL.createObjectURL(blob(j.audioContent,j.contentType));const el=$(role);if(el)el.classList.add('speaking');const a=new Audio(url);audio=a;await new Promise((ok,no)=>{a.onended=ok;a.onerror=no;a.play().catch(no)}).finally(()=>{URL.revokeObjectURL(url);if(el)el.classList.remove('speaking');if(audio===a)audio=null});await wait(220)}async function callDiscussion(text,sid){const r=await fetch('/api/discussion',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,session_id:sid,practice_mode:true})}),j=await r.json();if(!r.ok)throw Error(j.detail||j.error||r.status);return j}function norm(t){return t.agent==='CEO-002'?'CEO-002':t.agent}function choose(turns,avoid,preferChair=false){const xs=(turns||[]).filter(t=>t.reply&&norm(t)!==avoid);if(preferChair){const c=xs.find(t=>norm(t)==='CEO-002');if(c)return c}const nonChair=xs.find(t=>norm(t)!=='CEO-002');return nonChair||xs[0]||(turns||[]).find(t=>t.reply)||null}function cleanReply(x){return String(x||'').replace(/\[ENOUGH\]/g,'').trim()}function enough(x){return String(x||'').includes('[ENOUGH]')}async function playOne(t,token){if(!t||stopped||token!==runToken)return null;const role=norm(t),name=t.agent_name||role,raw=String(t.reply||'').trim(),reply=cleanReply(raw);if(!reply)return{role,name,reply:'',enough:enough(raw)};log('['+name+'] '+reply);await speak(reply,role,token);return{role,name,reply,enough:enough(raw)}}async function run(){if(busy)return;busy=true;stopped=false;const token=++runToken;$('meeting').disabled=true;const topic=$('txt').value.trim();if(!topic){busy=false;$('meeting').disabled=false;return}const sid=crypto.randomUUID();let transcript='',lastRole='';$('status').textContent='主持人開題…';log('\n[001 何董事長] '+topic);try{let j=await callDiscussion('【單一話題默契練習】題目：'+topic+'。002陳啟航是主持人，先用一到兩句自然口語界定今天只討論這一題，然後邀請最相關的人先表達意見。這不是正式報告，不要念工單，不要裁示，不要產生工作分派。小晴與阿凱先不要同時搶話。',sid);let t=choose(j.turns,'',true),said=await playOne(t,token);if(said){transcript+=said.name+'：'+said.reply+'\n';lastRole=said.role}for(let i=0;i<6&&!stopped&&token===runToken;i++){$('status').textContent='默契練習中…';const p='【同一個單一話題練習，禁止開新議題】題目：'+topic+'\n目前實際對話：\n'+transcript+'\n現在只選一位最有必要接話的人。不要照座位輪流，也不要每個人都硬講。站在自己的角色自然回應上一句：可以贊成、不同意、追問、補充理由或提出另一種看法。一次一到三句，像同事坐在一起討論，不要報告腔，不要總結整場，不要產生 WorkOrder。若已沒有新的有用觀點，請由002主持人簡短收斂，並在最後加 [ENOUGH]。';j=await callDiscussion(p,sid);t=choose(j.turns,lastRole,false);said=await playOne(t,token);if(said){transcript+=said.name+'：'+said.reply+'\n';lastRole=said.role;if(said.enough&&i>=2)break}}if(stopped||token!==runToken)return;$('status').textContent='主持人收斂…';j=await callDiscussion('【單一話題練習收尾】題目：'+topic+'\n剛才對話：\n'+transcript+'\n請002陳啟航只做主持人式收尾：用二到三句說明目前主要觀點、哪裡仍有分歧或下一次值得再談什麼。不要做正式裁示，不要指定Owner，不要建立WorkOrder，不要假裝已形成共識。',sid);t=choose(j.turns,lastRole,true);said=await playOne(t,token);if(said)transcript+=said.name+'：'+said.reply+'\n';$('status').textContent='本次單一話題練習完成'}catch(e){$('status').textContent='錯誤：'+e.message;log('[ERROR] '+e.message)}finally{if(token===runToken){busy=false;$('meeting').disabled=false}}}$('meeting').onclick=run;$('stop').onclick=()=>{stopped=true;runToken++;busy=false;$('meeting').disabled=false;if(audio){audio.pause();audio.currentTime=0;audio=null}$('status').textContent='已停止'};</script></body></html>
