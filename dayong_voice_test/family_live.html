<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大用一家人開會室</title><style>body{font-family:system-ui;background:#111;color:#eee;max-width:900px;margin:auto;padding:18px}.card{background:#1c1c1c;border:1px solid #333;border-radius:16px;padding:16px;margin:12px 0}.seat{display:inline-block;padding:10px;margin:4px;border:1px solid #58d68d;border-radius:10px}.speaking{background:#443814}button,input{font-size:18px;padding:13px;border-radius:10px;border:1px solid #555;background:#222;color:#fff;margin:4px}.go{background:#6d3cc3}input{width:70%}#log{white-space:pre-wrap;background:#080808;padding:12px;border-radius:10px;min-height:260px;max-height:500px;overflow:auto}.ok{color:#7dff9c}</style></head><body><h1>👨‍👩‍👧‍👦 大用一家人開會室</h1><div class="card"><span class="seat">001 何董事長</span><span class="seat" id="CEO-002">002 陳啟航</span><span class="seat" id="D1">D1 小晴</span><span class="seat" id="D2">D2 阿凱</span><p class="ok">固定聲線已鎖定：002 / 小晴 / 阿凱 · Inworld TTS-2</p></div><div class="card"><input id="txt" value="大哥，今天工作匯報，大家一起討論一下"><button class="go" id="meeting">開始一家人會議</button><button id="stop">停止</button><p id="status">READY</p></div><div class="card"><div id="log">系統：一家人開會室已就緒。\n</div></div><script>const $=x=>document.getElementById(x);let stopped=false,audio=null;function log(x){$('log').textContent+=x+'\n';$('log').scrollTop=$('log').scrollHeight}function blob(b64,t='audio/wav'){const b=atob(b64),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Blob([u],{type:t})}async function speak(text,role){if(stopped)return;const r=await fetch('/api/fixed-voice',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({role,text})}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.detail||j.error||r.status);const url=URL.createObjectURL(blob(j.audioContent,j.contentType));const el=$(role);if(el)el.classList.add('speaking');audio=new Audio(url);await new Promise((ok,no)=>{audio.onended=ok;audio.onerror=no;audio.play().catch(no)}).finally(()=>{URL.revokeObjectURL(url);if(el)el.classList.remove('speaking');audio=null})}async function run(){if(stopped)stopped=false;const text=$('txt').value.trim();if(!text)return;$('status').textContent='正在開會…';log('\n[001 何董事長] '+text);try{const r=await fetch('/api/discussion',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,session_id:crypto.randomUUID()})}),j=await r.json();if(!r.ok)throw Error(j.detail||j.error||r.status);for(const t of j.turns||[]){if(stopped)break;const role=t.agent==='CEO-002'?'CEO-002':t.agent;log('['+(t.agent_name||role)+'] '+t.reply);await speak(t.reply,role)}if(j.meeting_summary?.summary)log('[會議紀錄] '+j.meeting_summary.summary);$('status').textContent=stopped?'已停止':'本輪完成 · 會議紀錄已保存'}catch(e){$('status').textContent='錯誤：'+e.message;log('[ERROR] '+e.message)}}$('meeting').onclick=run;$('stop').onclick=()=>{stopped=true;if(audio){audio.pause();audio=null}$('status').textContent='已停止'};</script></body></html>
