<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大用一家人開會室</title><style>body{font-family:system-ui;background:#111;color:#eee;max-width:900px;margin:auto;padding:18px}.card{background:#1c1c1c;border:1px solid #333;border-radius:16px;padding:16px;margin:12px 0}.seat{display:inline-block;padding:10px;margin:4px;border:1px solid #58d68d;border-radius:10px}.speaking{background:#443814}button,input{font-size:18px;padding:13px;border-radius:10px;border:1px solid #555;background:#222;color:#fff;margin:4px}.go{background:#6d3cc3}button:disabled{opacity:.5}input{width:70%}#log{white-space:pre-wrap;background:#080808;padding:12px;border-radius:10px;min-height:260px;max-height:500px;overflow:auto}.ok{color:#7dff9c}</style></head><body><h1>👨‍👩‍👧‍👦 大用一家人開會室</h1><div class="card"><span class="seat">001 何董事長</span><span class="seat" id="CEO-002">002 陳啟航</span><span class="seat" id="D1">D1 小晴</span><span class="seat" id="D2">D2 阿凱</span><p class="ok">固定聲線已鎖定：002 / 小晴 / 阿凱 · Inworld TTS-2</p><p>會議模式：短句發言 → 互相回應 → 主席定奪。不是輪流念稿。</p></div><div class="card"><input id="txt" value="今天工作匯報，大家一起討論一下"><button class="go" id="meeting">開始一家人會議</button><button id="stop">停止</button><p id="status">READY</p></div><div class="card"><div id="log">系統：一家人開會室已就緒。\n</div></div><script>const $=x=>document.getElementById(x);let stopped=false,audio=null,busy=false,runToken=0;const wait=ms=>new Promise(r=>setTimeout(r,ms));function log(x){$('log').textContent+=x+'\n';$('log').scrollTop=$('log').scrollHeight}function blob(b64,t='audio/wav'){const b=atob(b64),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Blob([u],{type:t})}async function speak(text,role,token){if(stopped||token!==runToken)return;const r=await fetch('/api/fixed-voice',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({role,text})}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.detail||j.error||r.status);if(stopped||token!==runToken)return;const url=URL.createObjectURL(blob(j.audioContent,j.contentType));const el=$(role);if(el)el.classList.add('speaking');const a=new Audio(url);audio=a;await new Promise((ok,no)=>{a.onended=ok;a.onerror=no;a.play().catch(no)}).finally(()=>{URL.revokeObjectURL(url);if(el)el.classList.remove('speaking');if(audio===a)audio=null});await wait(280)}async function callDiscussion(text,sid){const r=await fetch('/api/discussion',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,session_id:sid})}),j=await r.json();if(!r.ok)throw Error(j.detail||j.error||r.status);return j}async function playTurns(j,token,filter=null){for(const t of j.turns||[]){if(stopped||token!==runToken)break;if(filter&&!filter(t))continue;const role=t.agent==='CEO-002'?'CEO-002':t.agent;log('['+(t.agent_name||role)+'] '+t.reply);await speak(t.reply,role,token)}}async function run(){if(busy)return;busy=true;stopped=false;const token=++runToken;$('meeting').disabled=true;const topic=$('txt').value.trim();if(!topic){busy=false;$('meeting').disabled=false;return}const sid=crypto.randomUUID();$('status').textContent='正在開會…';log('\n[001 何董事長] '+topic);try{$('status').textContent='第一輪：各自提出看法';const r1=await callDiscussion(topic+'。現在是第一輪，請像真人開會聊天，不要念稿。每個人只講一到三句口語短句，先提出自己的重點、疑問或建議，不要急著總結。',sid);await playTurns(r1,token);if(stopped||token!==runToken)return;$('status').textContent='第二輪：互相討論';log('--- 進入互相討論 ---');const r2=await callDiscussion('延續剛才同一場會議。現在不要重新報告，請直接針對剛才其他人的觀點互相回應：可以同意、追問、補充，也可以提出不同意見。像聊天一樣短句來回，不要一次把整篇稿念完。',sid);await playTurns(r2,token);if(stopped||token!==runToken)return;$('status').textContent='第三輪：主席定奪';log('--- 主席整理與定奪 ---');const r3=await callDiscussion('延續同一場會議。請002陳啟航以主席角色，根據前面大家的意見做最後整理、取捨、決策與下一步分工。用自然口語，不要長篇念稿。其他人除非有關鍵異議，先不要再重複報告。',sid);await playTurns(r3,token,t=>t.agent==='CEO-002');if(!stopped&&token===runToken){const s=r3.meeting_summary?.summary||r2.meeting_summary?.summary||r1.meeting_summary?.summary;if(s)log('[會議紀錄] '+s);$('status').textContent='會議完成 · 已討論並由主席定奪'}}catch(e){$('status').textContent='錯誤：'+e.message;log('[ERROR] '+e.message)}finally{if(token===runToken){busy=false;$('meeting').disabled=false}}}$('meeting').onclick=run;$('stop').onclick=()=>{stopped=true;runToken++;busy=false;$('meeting').disabled=false;if(audio){audio.pause();audio.currentTime=0;audio=null}$('status').textContent='已停止'};</script></body></html>
