<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大用一家人開會室</title><style>body{font-family:system-ui;background:#111;color:#eee;max-width:900px;margin:auto;padding:18px}.card{background:#1c1c1c;border:1px solid #333;border-radius:16px;padding:16px;margin:12px 0}.seat{display:inline-block;padding:10px;margin:4px;border:1px solid #58d68d;border-radius:10px}.speaking{background:#443814}.chair{border-color:#f5b041}button,input{font-size:18px;padding:13px;border-radius:10px;border:1px solid #555;background:#222;color:#fff;margin:4px}.go{background:#6d3cc3}button:disabled{opacity:.5}input{width:70%}#log{white-space:pre-wrap;background:#080808;padding:12px;border-radius:10px;min-height:280px;max-height:520px;overflow:auto}.ok{color:#7dff9c}.hint{color:#bbb}</style></head><body><h1>👨‍👩‍👧‍👦 大用一家人開會室</h1><div class="card"><span class="seat">001 何董事長</span><span class="seat chair" id="CEO-002">002 陳啟航 · 主席</span><span class="seat" id="D1">D1 小晴</span><span class="seat" id="D2">D2 阿凱</span><p class="ok">固定聲線：002 / 小晴 / 阿凱 · Inworld TTS-2</p><p class="hint">公司型會議：問題提出 → 自然討論 → 有異議就說明 → 主席裁示。不是逐人報告，也不是固定輪流。</p></div><div class="card"><input id="txt" value="今天工作有什麼卡點或需要決定的事情，大家直接提出來討論"><button class="go" id="meeting">開始一家人會議</button><button id="stop">停止</button><p id="status">READY</p></div><div class="card"><div id="log">系統：一家人開會室已就緒。\n</div></div><script>const $=x=>document.getElementById(x);let stopped=false,audio=null,busy=false,runToken=0;const wait=ms=>new Promise(r=>setTimeout(r,ms));function log(x){$('log').textContent+=x+'\n';$('log').scrollTop=$('log').scrollHeight}function blob(b64,t='audio/wav'){const b=atob(b64),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Blob([u],{type:t})}async function speak(text,role,token){if(stopped||token!==runToken)return;const r=await fetch('/api/fixed-voice',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({role,text})}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.detail||j.error||r.status);if(stopped||token!==runToken)return;const url=URL.createObjectURL(blob(j.audioContent,j.contentType));const el=$(role);if(el)el.classList.add('speaking');const a=new Audio(url);audio=a;await new Promise((ok,no)=>{a.onended=ok;a.onerror=no;a.play().catch(no)}).finally(()=>{URL.revokeObjectURL(url);if(el)el.classList.remove('speaking');if(audio===a)audio=null});await wait(220)}async function callDiscussion(text,sid){const r=await fetch('/api/discussion',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,session_id:sid})}),j=await r.json();if(!r.ok)throw Error(j.detail||j.error||r.status);return j}function norm(t){return t.agent==='CEO-002'?'CEO-002':t.agent}function choose(turns,avoid,preferChair=false){const xs=(turns||[]).filter(t=>t.reply&&norm(t)!==avoid);if(preferChair){const c=xs.find(t=>norm(t)==='CEO-002');if(c)return c}const nonChair=xs.find(t=>norm(t)!=='CEO-002');return nonChair||xs[0]||(turns||[]).find(t=>t.reply)||null}async function playOne(t,token){if(!t||stopped||token!==runToken)return null;const role=norm(t);const name=t.agent_name||role;const reply=String(t.reply||'').trim();if(!reply)return null;log('['+name+'] '+reply);await speak(reply,role,token);return{role,name,reply}}async function run(){if(busy)return;busy=true;stopped=false;const token=++runToken;$('meeting').disabled=true;const topic=$('txt').value.trim();if(!topic){busy=false;$('meeting').disabled=false;return}const sid=crypto.randomUUID();let transcript='';let lastRole='';$('status').textContent='正在開會…';log('\n[001 何董事長] '+topic);try{let j=await callDiscussion(topic+'。這是一場一般公司內部小型工作會議。不要做完整報告，不要逐人輪流。請由目前最有直接意見、最了解執行狀況的一位先開口，只說一到兩句口語短句，提出卡點、可行性、風險或建議。002主席先聽，不要急著總結。',sid);let t=choose(j.turns,lastRole,false);let said=await playOne(t,token);if(said){transcript+=said.name+'：'+said.reply+'\n';lastRole=said.role}for(let i=0;i<4&&!stopped&&token===runToken;i++){$('status').textContent='討論中 · 第'+(i+2)+'個自然發言';const prompt='延續同一場公司工作會議。剛才實際對話如下：\n'+transcript+'\n現在請最適合接這一句的人自然回應。不要重複前面內容；可以同意、反對、追問、補充執行困難、提出替代方案。只有有新內容的人才講，一到兩句口語短句即可。不要總結整場，不要念稿。002主席只有在需要釐清爭點、追問或把話題拉回來時才介入。';j=await callDiscussion(prompt,sid);t=choose(j.turns,lastRole,false);said=await playOne(t,token);if(said){transcript+=said.name+'：'+said.reply+'\n';lastRole=said.role}}if(stopped||token!==runToken)return;$('status').textContent='主席裁示';log('--- 主席裁示 ---');j=await callDiscussion('延續同一場會議。以下是剛才實際討論：\n'+transcript+'\n現在請002陳啟航以主席角色做裁示。先指出真正的爭點或共識，再明確決定：要做、暫緩、改方案或先測試；若可執行，說清楚誰負責什麼與下一步。用自然口語，三到五句內，不要念正式公文。其他人先不要發言。',sid);t=choose(j.turns,lastRole,true);said=await playOne(t,token);if(said)transcript+=said.name+'：'+said.reply+'\n';const s=j.meeting_summary?.summary;if(s)log('[會議紀錄] '+s);$('status').textContent='會議完成 · 已討論並由主席裁示'}catch(e){$('status').textContent='錯誤：'+e.message;log('[ERROR] '+e.message)}finally{if(token===runToken){busy=false;$('meeting').disabled=false}}}$('meeting').onclick=run;$('stop').onclick=()=>{stopped=true;runToken++;busy=false;$('meeting').disabled=false;if(audio){audio.pause();audio.currentTime=0;audio=null}$('status').textContent='已停止'};</script></body></html>
